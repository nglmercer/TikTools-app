name: CodeQL

on:
  # Final verification only. CodeQL must not race CI or the release: it runs
  # when both have passed for the same commit, whichever finishes last.
  # Manual runs remain available from the Actions tab.
  workflow_run:
    workflows: [CI, Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  RUSTUP_TOOLCHAIN: 1.99.1

jobs:
  gate:
    name: require CI and release to pass
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check the other workflow passed for the same commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER: ${{ github.event.workflow_run.name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$TRIGGER" in
            CI) other=release.yml ;;
            Release) other=ci.yml ;;
            *) echo "should_run=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          # If this workflow finished first, the other may still be running.
          # A short grace period lets the last completion see a final result.
          conclusion=""
          for _ in 1 2 3 4 5 6; do
            conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${other}/runs?head_sha=${HEAD_SHA}&per_page=1" --jq '.workflow_runs[0].conclusion // empty')
            [ "$conclusion" = success ] && break
            [ -n "$conclusion" ] && [ "$conclusion" != queued ] && [ "$conclusion" != in_progress ] && break
            sleep 10
          done
          if [ "$conclusion" = success ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping CodeQL: ${other} has not passed for ${HEAD_SHA} (result: ${conclusion:-none})"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - rust
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Rust and Linux dependencies
        if: matrix.language == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev \
            libappindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            mold \
            pkg-config
          rustup toolchain install "${{ env.RUSTUP_TOOLCHAIN }}" --profile minimal

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild Rust
        if: matrix.language == 'rust'
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
