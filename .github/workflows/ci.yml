name: CI

on:
  pull_request:
    branches:
      - remake
  push:
    branches:
      - remake
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.4
  RUSTUP_TOOLCHAIN: 1.99.1
  MSRV_TOOLCHAIN: 1.95.0

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Resolve Bun cache directory
        id: bun-cache
        shell: bash
        run: echo "dir=$(bun pm cache)" >> "$GITHUB_OUTPUT"

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.bun-cache.outputs.dir }}
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install frontend dependencies from the lockfile
        run: bun ci

      - name: Lint frontend
        run: bun scripts/task.ts frontend-lint

      - name: Test frontend
        run: bun scripts/task.ts frontend-test
      - name: Verify universal widget contracts
        run: bun scripts/check-universal.mjs

      - name: Build frontend
        run: bun scripts/task.ts frontend-build

  rust:
    name: rust
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        timeout-minutes: 12
        run: |
          set -euo pipefail

          # Avoid hanging indefinitely on an unresponsive Ubuntu package mirror.
          apt_opts=(
            -o Acquire::Retries=2
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )

          echo "::group::Refresh APT indexes"
          time sudo apt-get "${apt_opts[@]}" update
          echo "::endgroup::"

          echo "::group::Install native build dependencies"
          time sudo DEBIAN_FRONTEND=noninteractive apt-get "${apt_opts[@]}" install --no-install-recommends -y \
            libasound2-dev \
            libappindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            mold \
            pkg-config
          echo "::endgroup::"

      - name: Install current Rust with validation tools
        run: rustup toolchain install "${{ env.RUSTUP_TOOLCHAIN }}" --profile minimal --component rustfmt --component clippy

      - name: Set up Bun for plugin packaging
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Resolve Bun cache directory
        id: bun-cache
        shell: bash
        run: echo "dir=$(bun pm cache)" >> "$GITHUB_OUTPUT"

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.bun-cache.outputs.dir }}
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies for plugin packaging
        run: bun ci

      # `tiktools-remote` with `browser-app` (enabled by --all-features below)
      # embeds dist/web at build time; dist/ is not committed and the frontend
      # job's output is not shared with this job, so build it here.
      - name: Build frontend for browser-app assets
        run: bun scripts/task.ts frontend-build

      - name: Cache Cargo dependencies and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Check generated contracts and dependencies
        run: |
          bun scripts/task.ts contracts --check
          bun scripts/check-tiktok-signer-revision.ts

      - name: Check Rust formatting
        run: node scripts/cargo-with-linker.mjs fmt --all -- --check

      - name: Run Rust Clippy
        run: node scripts/cargo-with-linker.mjs clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test Rust workspace
        # Tests share the on-disk app data directory and drive real SQLite
        # writers; running them serially avoids shutdown-timing flakes on
        # loaded runners (the 30s points flush can otherwise miss its budget).
        run: node scripts/cargo-with-linker.mjs test --workspace --locked -- --test-threads=1

      # Native TikTok is deliberately optional in tiktools-core, so default
      # workspace tests otherwise report 0 executed batched-like E2E tests.
      - name: Test native TikTok batched likes end to end
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cargo-with-linker.mjs test -p tiktools-core --locked --features native-tiktok --lib -- --list |
            grep -F 'e2e_batched_likes_trigger_saved_150_goals_without_breaking_old_templates'
          node scripts/cargo-with-linker.mjs test -p tiktools-core --locked --features native-tiktok --lib e2e_batched_likes_trigger_saved_150_goals_without_breaking_old_templates -- --nocapture

      - name: Test optional local browser adapter
        run: node scripts/cargo-with-linker.mjs test -p tiktools-cli --features local-web --locked

      - name: Verify control surface end to end
        run: |
          node scripts/cargo-with-linker.mjs build -p tiktools-cli --locked
          ./target/debug/tiktools api verify --sandbox

  msrv:
    name: msrv
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        timeout-minutes: 12
        run: |
          set -euo pipefail

          # Avoid hanging indefinitely on an unresponsive Ubuntu package mirror.
          apt_opts=(
            -o Acquire::Retries=2
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )

          echo "::group::Refresh APT indexes"
          time sudo apt-get "${apt_opts[@]}" update
          echo "::endgroup::"

          echo "::group::Install native build dependencies"
          time sudo DEBIAN_FRONTEND=noninteractive apt-get "${apt_opts[@]}" install --no-install-recommends -y \
            libasound2-dev \
            libappindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            mold \
            pkg-config
          echo "::endgroup::"

      - name: Install MSRV Rust
        run: rustup toolchain install "${{ env.MSRV_TOOLCHAIN }}" --profile minimal

      - name: Cache Cargo dependencies and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-msrv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-msrv-${{ runner.os }}-${{ runner.arch }}-

      - name: Check workspace on MSRV
        run: node scripts/cargo-with-linker.mjs +${{ env.MSRV_TOOLCHAIN }} check --workspace --locked

      - name: Test client and CLI on MSRV
        run: node scripts/cargo-with-linker.mjs +${{ env.MSRV_TOOLCHAIN }} test -p tiktools-client -p tiktools-cli --locked

  plugin-runtime:
    # The QuickJS plugin runtime and its in-process Node-API host (native
    # `.node` addons) ship C and platform-specific code, so run the loader's
    # tests, including the napi-rs addon integration tests, on every desktop OS.
    name: plugin runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install current Rust
        run: rustup toolchain install "${{ env.RUSTUP_TOOLCHAIN }}" --profile minimal

      - name: Set up MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Test plugin loader and Node-API host
        run: cargo +${{ env.RUSTUP_TOOLCHAIN }} test -p tiktools-plugin-loader --locked -- --test-threads=1

  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 12
        run: |
          set -euo pipefail

          # Avoid hanging indefinitely on an unresponsive Ubuntu package mirror.
          apt_opts=(
            -o Acquire::Retries=2
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )

          echo "::group::Refresh APT indexes"
          time sudo apt-get "${apt_opts[@]}" update
          echo "::endgroup::"

          echo "::group::Install native build dependencies"
          time sudo DEBIAN_FRONTEND=noninteractive apt-get "${apt_opts[@]}" install --no-install-recommends -y \
            libasound2-dev \
            libappindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            mold \
            pkg-config
          echo "::endgroup::"

      - name: Install current Rust
        run: rustup toolchain install "${{ env.RUSTUP_TOOLCHAIN }}" --profile minimal

      - name: Set up MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install optional LLVM linker
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          choco install llvm --no-progress -y
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Install native Perl for vendored OpenSSL
        if: runner.os == 'Windows'
        run: choco install strawberryperl --no-progress -y

      - name: Test Windows build environment detection
        if: runner.os == 'Windows'
        env:
          TIKTOOLS_TEST_WINDOWS_PERL: '1'
        run: node --test scripts/cargo-with-linker.test.mjs

      - name: Cache Cargo dependencies and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-desktop-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-desktop-${{ runner.os }}-${{ runner.arch }}-

      - name: Check desktop crate
        run: node scripts/cargo-with-linker.mjs check -p tiktools-desktop --locked

      - name: Build Windows headless development CLI
        if: runner.os == 'Windows'
        run: node scripts/cargo-with-linker.mjs build -p tiktools-cli --features local-web --locked

      - name: Build Windows desktop release and verify GUI subsystem
        if: runner.os == 'Windows'
        run: |
          node scripts/cargo-with-linker.mjs build -p tiktools-desktop --release --locked
          pwsh -NoProfile -File scripts/check-windows-pe.ps1 target/release/tiktools-desktop.exe
