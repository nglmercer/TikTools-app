name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.4
  RUSTUP_TOOLCHAIN: 1.99.1

jobs:
  version:
    name: validate release version
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install frontend dependencies from the lockfile
        run: bun ci

      - name: Validate release tag and manifest versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun scripts/task.ts version check

      - name: Classify release channel
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bun -e 'const version = process.env.RELEASE_TAG.slice(1).split("+")[0]; console.log(`prerelease=${version.includes("-")}`)' >> "$GITHUB_OUTPUT"

  quality:
    name: run CI quality gate
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: package (${{ matrix.platform }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install frontend dependencies from the lockfile
        run: bun ci

      - name: Build frontend assets
        run: bun scripts/task.ts frontend-build

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev \
            libappindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            mold \
            pkg-config

      - name: Install current Rust
        run: rustup toolchain install "${{ env.RUSTUP_TOOLCHAIN }}" --profile minimal

      - name: Set up MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Cache Cargo dependencies and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-${{ runner.arch }}-

      - name: Build release desktop binary
        run: node scripts/cargo-with-linker.mjs build -p tiktools-desktop --release --locked

      - name: Install pinned cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Validate compiled desktop version before packaging
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun scripts/check-version.ts --binary

      - name: Verify Windows release uses the GUI subsystem
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File scripts/check-windows-pe.ps1 target/release/tiktools-desktop.exe

      - name: Assemble and validate portable package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: bun scripts/task.ts package

      - name: Package and verify desktop installers
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: bun scripts/package-installers.ts

      - name: Upload release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: release/TikTools-*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish GitHub release
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum TikTools-* > SHA256SUMS.txt

      - name: Create draft release with immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          args=(--draft --verify-tag --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          # Creating an existing release must fail: never overwrite historical assets.
          gh release create "$RELEASE_TAG" release-assets/TikTools-* release-assets/SHA256SUMS.txt "${args[@]}"

      - name: Verify uploaded release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir uploaded-assets
          gh release download "$RELEASE_TAG" --dir uploaded-assets
          cmp release-assets/SHA256SUMS.txt uploaded-assets/SHA256SUMS.txt
          (cd uploaded-assets && sha256sum --check SHA256SUMS.txt)
          # Reject missing or unexpected assets before exposing the release.
          diff -u <(cd release-assets && find . -maxdepth 1 -type f -printf '%f\n' | sort) \
                  <(cd uploaded-assets && find . -maxdepth 1 -type f -printf '%f\n' | sort)

      - name: Publish verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false
