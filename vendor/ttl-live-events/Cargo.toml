[package]
name = "ttl-live-events"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/nglmercer/tiktok-signer"
description = "Stable TikTok LIVE normalization with independent diagnostic and wire depth limits"
publish = false

[dependencies]
ttl-live-proto = { path = "../ttl-live-proto" }
ttl-sign-core = { git = "https://github.com/nglmercer/tiktok-signer", rev = "4f9d0b63799c3e23cf20be717779ece507b9eed4" }
prost = "0.14.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"
base64 = "0.22"
