syntax = "proto3";

package webcast.shared;

import "webcast/model/base/messages.proto";

message AuthenticationInfo {
  string custom_verify = 1;
  string enterprise_verify_reason = 2;
  model.base.ImageModel authentication_badge = 3;
}

message EnhancementText {
  int32 type = 1;
  repeated PlaceholderInfo placeholder_info = 2;
}

message EnhancementTextInfo {
  repeated EnhancementText enhancement_texts = 1;
}

message PlaceholderInfo {
  string placeholder = 1;
  string value = 2;
}

message ShopLabelImage {
  int32 height = 1;
  int32 width = 2;
  string minetype = 3;
  string thumb_uri = 4;
  repeated string thumb_uri_list = 5;
  string uri = 6;
  repeated string url_list = 7;
  string color = 8;
}

message UserInfo {
  int64 user_id = 1;
  string nick_name = 2;
  model.base.ImageModel avatar_thumb = 3;
}
