syntax = "proto3";

package webcast.im;

import "webcast/shared/message.proto";

message HeartBeatMessage {
  int64 room_id = 1;
  int64 send_packet_seq_id = 2;
}

message WebcastPushFrame {
  int64 seq_id = 1;
  int64 log_id = 2;
  int64 service = 3;
  int64 method = 4;
  repeated PushHeader headers = 5;
  string payload_encoding = 6;
  string payload_type = 7;
  bytes payload = 8;
}

message PushHeader {
  string key = 1;
  string value = 2;
}

message SystemMessage {
  string description = 2;
}

message WebcastSystemMessage {
  webcast.shared.message.CommonMessageData common = 1;
  string message = 2;
}

message WebcastImEnterRoomMessage {
  int64 room_id = 1;
  string room_tag = 2;
  string live_region = 3;
  int64 live_id = 4;
  string identity = 5;
  string cursor = 6;
  int64 account_type = 7;
  int64 enter_unique_id = 8;
  string filter_welcome_msg = 9;
  bool is_anchor_continue_keep_msg = 10;
}

