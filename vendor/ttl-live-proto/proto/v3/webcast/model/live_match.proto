syntax = "proto3";

package webcast.model.live.match;

import "webcast/model/base/messages.proto";
import "webcast/model/data/messages.proto";
import "webcast/model/message/common.proto";

message AnchorGiftModeMetaMap {
  map<int64, GiftModeMetaList> anchor_gift_mode_metas = 1;
}

message AnchorMatchSettings {
  bool enable_ai_commentary = 1;
}

message BattleABTest {

  data.BattleABTestType ab_test_type = 1;
  int32 group = 2;
}

message BattleABTestList {
  repeated BattleABTest ab_test_list = 1;
}

message BattleABTestSetting {
  int64 key = 1;
  BattleABTestList value = 2;
}

message BattleBaseUserInfo {
  int64 user_id = 1;
  string nick_name = 2;
  base.ImageModel avatar_thumb = 3;
  string display_id = 4;
  int64 room_id = 5;
  int32 invitation_role = 6;
}

message BattleBonusConfig {
  int64 preview_start_time = 1;
  repeated PreviewPeriod preview_config = 2;
  TaskPeriodConfig target_config = 3;
  RewardPeriodConfig reward_config = 4;
  map<int64, BattleTaskGiftAmountGuide> gift_amount_guide = 5;
  int64 preview_start_timestamp = 6;
  string preview_click_action_schema_url = 7;
}

message BattleComboInfo {
  int64 user_id = 1;
  int64 combo_status = 2;
  int64 combo_count = 3;
  string combo_icon_url = 4;
  int32 combo_type = 5;
  string combo_rule_guide_schema = 6;
  string user_id_str = 7;
  string combo_count_str = 8;
}

message BattleEffect {
  string type = 1;
  repeated string uid_list = 2;
  string effect_extra = 3;
}

message BattleEffectInfos {
  repeated BattleEffect effect_info_list = 1;
  int64 effect_list_version = 2;
}

message BattleFeatureFlags {
  bool enable_match_countdown_optimization = 1;
  bool hide_combo_count_on_start = 2;
}

message BattlePrompt {
  string prompt_key = 1;
  repeated BattlePromptElem elems = 2;
}

message BattlePromptElem {
  string prompt_field = 1;
  string value = 2;
}

message BattleRivalTag {
  base.ImageModel bg_image = 1;
  base.ImageModel icon_image = 2;
  string content = 3;
}

message BattleTaskGiftAmountGuide {
  BattlePrompt guide_prompt = 1;
  int32 prompt_type = 2;
  int32 disappear_duration = 3;
  base.ImageModel icon_image = 11;
  base.ImageModel gift_image = 12;
  int64 recommend_gift_id = 21;
  int32 recommend_gift_count = 22;
  .webcast.model.message.common.Text guide_content = 23;
}

message BattleTeamResult {
  int64 team_id = 1;
  repeated BattleTeamUser team_user = 2;
  int32 result = 3;
  int64 total_score = 4;
  int64 total_enigma_score = 5;
  int64 total_enigma_uv = 6;
}

message BattleTeamUser {
  int64 user_id = 1;
  int64 score = 2;
  string user_id_str = 3;
  int64 enigma_score = 4;
}

message BattleUserInfo {
  BattleBaseUserInfo user = 1;
  repeated BattleRivalTag tags = 2;
}

message BestTeammateRelation {
  int64 user_id = 1;
  int64 best_teammate_id = 2;
}

message CohostContentGuideInfo {
  int32 recommended_battle_type = 1;
}

message CommonCardInfo {
  string card_name_key = 1;
  base.ImageModel card_image = 2;
  int64 send_time_sec = 3;
  BattleUserInfo send_user = 4;
  int64 effect_last_duration = 5;
  string rule_url = 6;
  int64 effect_time_sec = 7;
  int64 to_anchor_id = 8;
  string to_anchor_id_str = 9;
}

message CommunityActiveDecoration {
  int64 decoration_id = 1;
  int32 slot_type = 2;
  map<int32, base.ImageModel> images = 3;
}

message CommunityHeartMeInfo {
  map<int32, CommunityActiveDecoration> slots = 1;
  base.ImageModel thrown_item_image = 2;
  int64 anchor_community_level = 3;
}

message CriticalStrikeCardInfo {
  string card_name_key = 1;
  base.ImageModel card_image = 2;
  int64 send_time_sec = 3;
  BattleUserInfo send_user = 4;
  int64 effect_last_duration = 5;
  int64 critical_strike_rate_low = 6;
  int64 critical_strike_rate_high = 7;
  int64 multiple = 8;
  string gift_name_key = 9;
  string rule_url = 10;
  int64 effect_time_sec = 11;
  int64 to_anchor_id = 12;
  string to_anchor_id_str = 13;
}

message EnigmaBattleExtraInfo {
  bool has_started = 1;
  bool is_gift_from_enigma = 2;
}

message EnigmaBattleSetting {
  bool is_startable = 1;
  int64 enigma_battle_campaign_start = 2;
  int64 enigma_battle_campaign_end = 3;
  repeated int64 enigma_score_reveal_countdown_sec = 4;
  int64 enigma_score_reveal_duration_sec = 5;
}

message ExtraTimeCardInfo {
  string card_name_key = 1;
  base.ImageModel card_image = 2;
  int64 send_time_sec = 3;
  BattleUserInfo send_user = 4;
  int64 effect_last_duration = 5;
  string rule_url = 6;
  int64 effect_time_sec = 7;
  int64 to_anchor_id = 8;
  int64 extra_duration_sec = 9;
  string to_anchor_id_str = 10;
}

message GiftModeMeta {
  int64 gift_id = 1;
  string gift_name_key = 2;
  base.ImageModel gift_icon_image = 3;
  .webcast.model.message.common.Text gift_mode_desc = 4;
}

message GiftModeMetaList {
  repeated GiftModeMeta gift_mode_meta = 1;
}

message GiftModeMetaV2 {
  map<int64, AnchorGiftModeMetaMap> anchor_gift_mode_meta_by_type = 1;
}

message HighScoreControlCfg {
  bool normal_control_applied = 1;
  int64 threshold = 2;
  repeated int64 origin_display_to_user_list = 3;
}

message LeagueScoreInfo {
  int64 estimated_score = 1;
  bool is_opt_out = 2;
  bool is_activity_period = 3;
  .webcast.model.message.common.Text content_text = 4;
  bool class_opt_out = 5;
  .webcast.model.message.common.Text content_text_open = 6;
  int32 match_theme = 7;
  base.ImageModel left_icon = 8;
  base.ImageModel right_icon = 9;
  string right_schema_jump_link = 10;
}

message MatchInvitePanelConfig {
  .webcast.model.message.common.Text header_text = 1;
  .webcast.model.message.common.Text header_text_dark_mode = 2;
  .webcast.model.message.common.Text desc_text = 3;
  .webcast.model.message.common.Text desc_text_dark_mode = 4;
}

message MatchOpeningAnimationConfig {
  string start_animation_rule = 1;
}

message MatchPunishEffectInfo {
  map<int64, int64> user_to_effect_map = 1;
  map<int64, data.EffectStruct> effect_to_effect_struct_map = 2;
}

message MatchPunishExtraInfo {
  MatchPunishEffectInfo match_punish_effect_info = 1;
  CohostContentGuideInfo cohost_content_guide_info = 2;
  RecommendedPlaybookInfo recommended_playbook_info = 3;
}

message MatchThemeDisplayResource {
  int32 match_theme = 1;
  MatchOpeningAnimationConfig match_opening_animation_config = 2;
  MatchTitleBarConfig match_title_bar_config = 3;
  MatchInvitePanelConfig match_invite_panel_config = 4;
}

message MatchTitleBarConfig {
  repeated MatchTitleBarDisplayRule display_rules = 1;
}

message MatchTitleBarDisplayRule {
  MatchTitleBarTrigger trigger = 1;
  TitleBarDisplayResource display_resource = 2;
}

message MatchTitleBarTrigger {
  int32 type = 1;
}

message PlaybookBizExtra {
  map<string, string> custom_atomic_capabilities = 1;
}

message PotionCardInfo {
  string card_name_key = 1;
  base.ImageModel card_image = 2;
  int64 send_time_sec = 3;
  BattleUserInfo send_user = 4;
  int64 effect_last_duration = 5;
  string rule_url = 6;
  int64 effect_time_sec = 7;
  int64 to_anchor_id = 8;
}

message PreviewPeriod {
  int64 duration = 1;
  BattlePrompt prompt = 2;
  base.ImageModel icon_image = 25;
}

message RecommendedPlaybookInfo {
  repeated int64 playbook_ids = 1;
  map<int64, PlaybookBizExtra> playbook_biz_extras = 2;
}

message RewardPeriodConfig {
  int64 reward_start_time = 1;
  int64 duration = 2;
  int32 reward_multiple = 3;
  int64 reward_start_timestamp = 4;
  BattlePrompt reward_prepare_prompt = 11;
  BattlePrompt rewarding_prompt = 12;
  BattlePrompt click_prompt = 13;
}

message SmokeCardInfo {
  string card_name_key = 1;
  base.ImageModel card_image = 2;
  int64 send_time_sec = 3;
  BattleUserInfo send_user = 4;
  int64 effect_last_duration = 5;
  string rule_url = 6;
  int64 effect_time_sec = 7;
  int64 to_anchor_id = 12;
  string to_anchor_id_str = 13;
}

message SpecialEffectCardInfo {
  string card_name_key = 1;
  base.ImageModel card_image = 2;
  int64 send_time_sec = 3;
  BattleUserInfo send_user = 4;
  int64 effect_last_duration = 5;
  string rule_url = 6;
  int64 effect_time_sec = 7;
  int64 to_anchor_id = 8;
  string to_anchor_id_str = 9;
}

message TaskPeriodConfig {
  int64 target_start_time = 1;
  int64 duration = 2;
  int64 target_start_timestamp = 3;
  int32 click_action = 11;
  BattlePrompt click_prompt = 12;
  int32 prompt_type = 21;
  BattlePrompt static_prompt = 22;
  int64 progress_target = 23;
  int32 target_type = 24;
  base.ImageModel icon_image = 25;
  string click_action_schema_url = 26;
}

message TeamMatchCampaign {
  repeated BestTeammateRelation best_teammate_relation = 1;
  repeated int64 start_sfx_team_id = 2;
  bool has_team_match_mvp_sfx = 3;
}

message TitleBarDisplayResource {
  base.ImageModel left_icon = 1;
  .webcast.model.message.common.Text content_text = 2;
  base.ImageModel right_icon = 3;
  string right_icon_schema_url = 4;
  int64 duration_ms = 5;
}

message Top2CardInfo {
  CommonCardInfo common = 1;
}

message Top3CardInfo {
  CommonCardInfo common = 1;
}

message VaultGloveCardInfo {
  CommonCardInfo common = 1;
  string gift_name_key = 2;
  int64 multiple = 3;
  int64 multiple_other = 4;
  int64 critical_strike_rate_low = 5;
  int64 critical_strike_rate_high = 6;
}

message WaveCardInfo {
  string card_name_key = 1;
  base.ImageModel card_image = 2;
  int64 send_time_sec = 3;
  BattleUserInfo send_user = 4;
  int64 effect_last_duration = 5;
  string rule_url = 6;
  int64 effect_time_sec = 7;
  int64 to_anchor_id = 8;
}
