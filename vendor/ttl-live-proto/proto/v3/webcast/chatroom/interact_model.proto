syntax = "proto3";

package webcast.chatroom.interact.model;

import "webcast/chatroom/model/interact_messages.proto";
import "webcast/model/data/messages.proto";
import "webcast/shared/messages.proto";

message AnchorLinkmicUserSettings {
  bool is_turn_on = 1;
  bool accept_multi_linkmic = 2;
  bool accept_not_follower_invite = 3;
  bool allow_gift_to_other_anchors = 4;
  bool block_invitation_of_this_live = 5;
  bool receive_friend_multi_host_invites = 6;
  bool receive_friend_multi_host_application = 7;
  bool block_this_multi_host_invites = 8;
  bool block_this_multi_host_application = 9;
  bool receive_not_friend_multi_host_invites = 10;
  bool receive_not_friend_multi_host_application = 11;
  bool allow_live_notice_of_friends = 12;
  bool allow_friend_invites = 13;
  bool allow_suggested_invites = 14;
  bool allow_friend_invites_when_offlive = 15;
  bool allow_user_cohost_suggestions = 16;
  bool allow_missed_invitation_notice = 17;
  bool allow_live_notice_of_suggested = 18;
  bool allow_guest_request_during_cohost = 19;
  bool allow_guest_apply_during_cohost = 20;
  .webcast.chatroom.model.interact.SubtitleSettings subtitle_setting = 21;
}

message BattleInfo {

  .webcast.model.data.RivalExtraInfo_BattleInfo_BattleInfoType info_type = 1;
  int64 value = 2;
}

message LinkerInfo {
  repeated shared.UserInfo linked_users = 1;
  bool in_quick_pairing = 2;
  repeated shared.UserInfo linked_guest_users = 3;
}

message OffliveInviteInfo {
  int64 inviter_timestamp = 1;
}

message ReserveInfo {
  int64 reservation_id = 1;

  .webcast.model.data.ReserveReplyStatus reply_status = 2;
  string bubble_tip = 3;
  int64 response_time = 4;
  bool is_reservation_sender = 5;
  int64 created_timestamp = 6;
  bool viewed = 7;
}

message RivalExtraInfo {
  string text = 1;

  .webcast.model.data.RivalExtraInfo_TextType text_type = 2;
  string label = 3;

  .webcast.model.data.RivalExtraInfo_AnchorLayer anchor_layer = 4;
  LinkerInfo linker_info = 5;
  AnchorLinkmicUserSettings linkmic_user_settings = 6;

  .webcast.chatroom.model.interact.BattleUserSettings battle_user_settings = 7;

  .webcast.model.data.RivalExtraInfo_InviteBlockReason invite_block_reason = 8;

  .webcast.model.data.LinkmicPlayType show_play_type = 9;

  .webcast.chatroom.model.interact.TopHostInfo top_host_info = 10;
  Tag tag = 11;
  ReserveInfo reserve_info = 12;

  .webcast.model.data.DetailBlockReason detail_block_reason = 13;
  .webcast.chatroom.model.interact.OptPairInfo opt_pair_info = 14;
  .webcast.chatroom.model.interact.TagV2 tag_v2 = 15;
  int64 eoy_level = 16;
  BattleInfo battle_info = 17;

  .webcast.model.data.CohostLayoutMode cohost_layout_mode = 18;
  .webcast.chatroom.model.interact.RivalsGameTag game_tag = 19;
  .webcast.chatroom.model.interact.GiftGalleryBadgeInfo gift_gallery_badge_info = 20;
  OffliveInviteInfo offlive_invite_info = 21;
  .webcast.chatroom.model.interact.UserSuggestionInfo user_suggestion_info = 22;
  .webcast.chatroom.model.interact.UserSuggestionInfo friend_suggestion_info = 23;
  .webcast.chatroom.model.interact.ActivityBadgeInfo activity_badge_info = 24;
}

message Tag {
  int32 tag_type = 1;
  string tag_value = 2;
  string tag_text = 3;
}
