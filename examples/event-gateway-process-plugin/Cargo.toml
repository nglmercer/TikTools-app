[package]
name = "tiktools-event-gateway"
version = "1.0.0"
edition = "2021"
publish = false
description = "Optional TikTools process plugin exposing DomainEvent over loopback HTTP/WebSocket"

[[bin]]
name = "event-gateway"
path = "src/main.rs"

[dependencies]
getrandom = "0.4.3"
http = "1.5.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
regex = "1.13.1"
tiktools-plugin-sdk = { path = "../../crates/tiktools-plugin-sdk" }
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
url = "2.5.8"

[profile.release]
lto = true
codegen-units = 1
