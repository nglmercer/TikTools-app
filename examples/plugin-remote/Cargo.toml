[package]
name = "example-plugin-remote"
version = "1.1.0"
edition = "2021"
publish = false
description = "Example installable remote-control plugin (not packaged; future registry)"

[[bin]]
name = "tiktools-remote-control-plugin"
path = "src/main.rs"

[dependencies]
tiktools-plugin-sdk = { path = "../../crates/tiktools-plugin-sdk" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = "0.3"
