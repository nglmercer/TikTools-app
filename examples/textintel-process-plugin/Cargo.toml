[package]
name = "tiktools-textintel-plugin"
version = "0.1.0"
edition = "2021"
publish = false
description = "Reference pre-filter event processor enriching TikTok LIVE events with local text intelligence"

[[bin]]
name = "tiktools-textintel"
path = "src/main.rs"

[lib]
name = "tiktools_textintel_plugin"
path = "src/lib.rs"

[[bench]]
name = "processor_latency"
harness = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiktools-plugin-sdk = { path = "../../crates/tiktools-plugin-sdk" }
tiktools-plugin-api = { path = "../../crates/tiktools-plugin-api" }
# Pinned upstream revision; bump deliberately after reviewing textintel diffs.
# production-local-lite keeps the engine offline (no network providers).
textintel = { git = "https://github.com/nglmercer/textintel", rev = "89b4322ead8e32b299a768c2f708a1455adb35de", default-features = false, features = ["production-local-lite"] }

[profile.release]
lto = true
codegen-units = 1
