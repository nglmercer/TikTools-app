    <!--
      Strict CSP for the isolated plugin document. The bundle is fully
      local: no remote scripts, styles, images, or connections. All host
      communication flows through the broker (native injection or
      postMessage to the parent frame), never fetch/XHR. Mirrors the
      desktop asset-server header except `frame-ancestors`, which is
      header-only (browsers ignore it in a meta element) — the served
      header carries it. Each resource directive lists 'self' (http

      rewritten `http:` URLs.
