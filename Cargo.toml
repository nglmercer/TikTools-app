[workspace]
members = [
    "crates/tiktools-app-update",
    "crates/tiktools-aggregation",
    "crates/tiktools-competitions",
    "crates/tiktools-control-api",
    "crates/tiktools-client",
    "crates/tiktools-cli",
    "crates/tiktools-desktop",
    "crates/tiktools-core",
    "crates/tiktools-plugin-api",
    "crates/tiktools-plugin-sdk",
    "crates/tiktools-plugin-store",
    "crates/tiktools-plugin-macros",
    "crates/tiktools-plugin-loader",
    "crates/tiktools-plugin-package",
    "crates/tiktools-plugin-registry",
    "crates/tiktools-plugin-installer",
    "crates/tiktools-plugin-devkit",
    "crates/tiktools-tls",
    "crates/cloud-client",
    "crates/cloud-contracts",
    "crates/tiktools-cloud-auth",
    "crates/tiktools-cloud-sync",
    "crates/tiktools-collaboration",
    "crates/tiktools-tiktok",
]
exclude = [
    # Installable-plugin example: built on its own, not part of the app workspace.
    "examples/plugin-remote",
    "vendor/ttl-live-proto",
    # napi-rs fixture for the napi-vm native addon tests. Built on demand by
    # the integration test with its own lockfile, never by the workspace.
    "crates/tiktools-plugin-loader/tests/fixtures/native-tsfn",
    # Musl libc-detection probe, built on demand the same way.
    "crates/tiktools-plugin-loader/tests/fixtures/musl-probe",
]
resolver = "2"

# Test binaries are re-executed per test under nextest and spawned as child
# processes by crash/boundary tests; full debuginfo makes them hundreds of MB.
# Keep line tables so panic backtraces stay useful, drop the rest.
[profile.test]
debug = 1

# Bundled C dependencies are compiled by their -sys build scripts at the
# profile's opt-level; at dev's opt-level=0 every DDL statement and commit
# runs ~10x slower, which dominated fixture setup (~4.5s per AppCore::new),
# and QuickJS/TLS runs unoptimized in plugin and cloud tests. Optimize just
# these C dependencies; Rust code stays at debug speed for build times.
[profile.test.package.libsqlite3-sys]
opt-level = 3
[profile.test.package.rquickjs-sys]
opt-level = 3
[profile.test.package.ring]
opt-level = 3
[profile.test.package.aws-lc-sys]
opt-level = 3

[workspace.package]
version = "4.5.0"
edition = "2021"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
ryu-js = "=1.0.3"
semver = { version = "1.0.28", features = ["serde"] }
schemars = "1.2.3"
thiserror = "2.0.21"
unicode-segmentation = "1.13.3"
tracing = "0.1.44"
fastrand = "2.5.0"
tokio-util = "0.7.20"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros", "time", "net", "io-util", "io-std", "fs"] }
rusqlite = { version = "0.41.0", default-features = false }
# No rustls provider here: the application selects one via tiktools-tls.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls-no-provider"] }
# RE2-style linear-time regex for bounded automation body transforms.
regex = "1.13"
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
libloading = "0.9.1"
sha2 = "0.11.1"
ring = "0.17.14"
url = "2.5.9"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }
# Declarative native-library providers (npm tarballs, GitHub release
# assets): pure-Rust download, verify, and extract for build/install
# tooling. Never linked into plugin guests.
tar = "0.4.46"
flate2 = "1.1.11"
base64 = "0.23.1"
getrandom = "0.4.3"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
rquickjs = { version = "0.14.0", features = ["loader", "futures", "array-buffer", "classes", "properties"] }

# The checked-in JavaScript/Bun package was only a compatibility implementation. The desktop
# host consumes the Rust crates directly from the upstream workspace at a pinned revision.
ttl-sign-core = { git = "https://github.com/nglmercer/tiktok-signer", rev = "720ba7ad17dea99376bb6497292dfcdfeefdea4f" }
ttl-live-discovery = { git = "https://github.com/nglmercer/tiktok-signer", rev = "720ba7ad17dea99376bb6497292dfcdfeefdea4f" }
ttl-live-events = { git = "https://github.com/nglmercer/tiktok-signer", rev = "720ba7ad17dea99376bb6497292dfcdfeefdea4f" }
ttl-live-proto = { git = "https://github.com/nglmercer/tiktok-signer", rev = "720ba7ad17dea99376bb6497292dfcdfeefdea4f" }
ttl-live-ws = { git = "https://github.com/nglmercer/tiktok-signer", rev = "720ba7ad17dea99376bb6497292dfcdfeefdea4f" }
ttl-sign-headless = { git = "https://github.com/nglmercer/tiktok-signer", rev = "720ba7ad17dea99376bb6497292dfcdfeefdea4f" }
ttl-sign-embedded = { git = "https://github.com/nglmercer/tiktok-signer", rev = "720ba7ad17dea99376bb6497292dfcdfeefdea4f" }
