[workspace]
members = [
    "crates/tiktools-app-update",
    "crates/tiktools-aggregation",
    "crates/tiktools-competitions",
    "crates/tiktools-control-api",
    "crates/tiktools-client",
    "crates/tiktools-cli",
    "crates/tiktools-desktop",
    "crates/tiktools-core",
    "crates/tiktools-plugin-api",
    "crates/tiktools-plugin-sdk",
    "crates/tiktools-plugin-macros",
    "crates/tiktools-plugin-loader",
    "crates/tiktools-plugin-package",
    "crates/tiktools-plugin-registry",
    "crates/tiktools-plugin-installer",
    "crates/tiktools-plugin-devkit",
    "crates/cloud-client",
    "crates/cloud-contracts",
    "crates/tiktools-cloud-auth",
    "crates/tiktools-cloud-sync",
    "crates/tiktools-collaboration",
    "crates/tiktools-remote",
    "crates/tiktools-peer",
    "crates/tiktools-rtc",
    "crates/tiktools-tiktok",
]
exclude = [
    "vendor/ttl-live-proto",
    # napi-rs fixture for the napi-vm native addon tests. Built on demand by
    # the integration test with its own lockfile, never by the workspace.
    "crates/tiktools-plugin-loader/tests/fixtures/native-tsfn",
    # Musl libc-detection probe, built on demand the same way.
    "crates/tiktools-plugin-loader/tests/fixtures/musl-probe",
]
resolver = "2"

[workspace.package]
version = "4.2.1-rc.2"
edition = "2021"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
ryu-js = "=1.0.3"
semver = { version = "1.0.28", features = ["serde"] }
schemars = "1.2.3"
thiserror = "2.0.21"
unicode-segmentation = "1.13.3"
tracing = "0.1.44"
fastrand = "2.5.0"
tokio-util = "0.7.20"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros", "time", "net", "io-util", "io-std", "fs"] }
rusqlite = { version = "0.41.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
libloading = "0.9.0"
sha2 = "0.11.1"
ring = "0.17.14"
url = "2.5.8"
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }
# Declarative native-library providers (npm tarballs, GitHub release
# assets): pure-Rust download, verify, and extract for build/install
# tooling. Never linked into plugin guests.
tar = "0.4.46"
flate2 = "1.1.10"
base64 = "0.23.1"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
rodio = { version = "0.23.0", features = ["tracing"] }
rquickjs = { version = "0.14.0", features = ["loader", "futures", "array-buffer", "classes", "properties"] }

# The checked-in JavaScript/Bun package was only a compatibility implementation. The desktop
# host consumes the Rust crates directly from the upstream workspace at a pinned revision.
ttl-sign-core = { git = "https://github.com/nglmercer/tiktok-signer", rev = "26ae0954276c0be572c0091b06e1d15033a3a255" }
ttl-live-discovery = { git = "https://github.com/nglmercer/tiktok-signer", rev = "26ae0954276c0be572c0091b06e1d15033a3a255" }
ttl-live-events = { git = "https://github.com/nglmercer/tiktok-signer", rev = "26ae0954276c0be572c0091b06e1d15033a3a255" }
ttl-live-proto = { git = "https://github.com/nglmercer/tiktok-signer", rev = "26ae0954276c0be572c0091b06e1d15033a3a255" }
ttl-live-ws = { git = "https://github.com/nglmercer/tiktok-signer", rev = "26ae0954276c0be572c0091b06e1d15033a3a255" }
ttl-sign-headless = { git = "https://github.com/nglmercer/tiktok-signer", rev = "26ae0954276c0be572c0091b06e1d15033a3a255" }
ttl-sign-embedded = { git = "https://github.com/nglmercer/tiktok-signer", rev = "26ae0954276c0be572c0091b06e1d15033a3a255" }

[patch."https://github.com/nglmercer/tiktok-signer"]
ttl-live-proto = { path = "vendor/ttl-live-proto" }
