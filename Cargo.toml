[workspace]
members = [
    "crates/tiktools-control-api",
    "crates/tiktools-client",
    "crates/tiktools-cli",
    "crates/tiktools-desktop",
    "crates/tiktools-core",
    "crates/tiktools-plugin-api",
    "crates/tiktools-plugin-sdk",
    "crates/tiktools-plugin-macros",
    "crates/tiktools-plugin-loader",
    "crates/tiktools-tiktok",
    "plugins/sonicboom/backend",
    "plugins/l4d2/backend",
]
exclude = [
    "vendor/ttl-live-proto",
    "examples/audio-process-plugin",
    "examples/event-gateway-process-plugin",
    "examples/textintel-process-plugin",
    # napi-rs fixture for the napi-vm native addon tests. Built on demand by
    # the integration test with its own lockfile, never by the workspace.
    "crates/tiktools-plugin-loader/tests/fixtures/native-tsfn",
    # Musl libc-detection probe, built on demand the same way.
    "crates/tiktools-plugin-loader/tests/fixtures/musl-probe",
]
resolver = "2"

[workspace.package]
version = "0.3.3"
edition = "2021"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.3"
thiserror = "2.0.21"
unicode-segmentation = "1.13.3"
tracing = "0.1.44"
fastrand = "2.5.0"
tokio-util = "0.7.20"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros", "time", "net", "io-util", "io-std", "fs"] }
rusqlite = { version = "0.41.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
libloading = "0.9.0"
sha2 = "0.11.1"
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }
# Declarative native-library providers (npm tarballs, GitHub release
# assets): pure-Rust download, verify, and extract for build/install
# tooling. Never linked into plugin guests.
tar = "0.4.46"
flate2 = "1.1.10"
base64 = "0.23.1"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
rodio = { version = "0.23.0", features = ["tracing"] }
# Native-addon integration uses `allow_addon` / `allow_addon_alias` plus
# `node:module` createRequire from napi-vm main. Pinned by rev like the
# ttl-* deps: a relative path cannot resolve in CI checkouts.
napi-vm = { git = "https://github.com/nglmercer/napi-vm", rev = "881cc8f1cec262049b6d31fa499b0d601ba673c5", default-features = false }

# The checked-in JavaScript/Bun package was only a compatibility implementation. The desktop
# host consumes the Rust crates directly from the upstream workspace at a pinned revision.
ttl-sign-core = { git = "https://github.com/nglmercer/tiktok-signer", rev = "141d39ea795536190fcf26b9dcab60c50637417b" }
ttl-live-discovery = { git = "https://github.com/nglmercer/tiktok-signer", rev = "141d39ea795536190fcf26b9dcab60c50637417b" }
ttl-live-events = { git = "https://github.com/nglmercer/tiktok-signer", rev = "141d39ea795536190fcf26b9dcab60c50637417b" }
ttl-live-proto = { git = "https://github.com/nglmercer/tiktok-signer", rev = "141d39ea795536190fcf26b9dcab60c50637417b" }
ttl-live-ws = { git = "https://github.com/nglmercer/tiktok-signer", rev = "141d39ea795536190fcf26b9dcab60c50637417b" }
ttl-sign-headless = { git = "https://github.com/nglmercer/tiktok-signer", rev = "141d39ea795536190fcf26b9dcab60c50637417b" }
ttl-sign-embedded = { git = "https://github.com/nglmercer/tiktok-signer", rev = "141d39ea795536190fcf26b9dcab60c50637417b" }

[patch."https://github.com/nglmercer/tiktok-signer"]
ttl-live-proto = { path = "vendor/ttl-live-proto" }
