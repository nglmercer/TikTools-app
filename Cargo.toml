[workspace]
members = [
    "crates/tiktools-control-api",
    "crates/tiktools-client",
    "crates/tiktools-cli",
    "crates/tiktools-desktop",
    "crates/tiktools-core",
    "crates/tiktools-plugin-api",
    "crates/tiktools-plugin-sdk",
    "crates/tiktools-plugin-macros",
    "crates/tiktools-plugin-loader",
    "crates/tiktools-tiktok",
    "plugins/sonicboom/backend",
]
exclude = [
    "examples/audio-process-plugin",
    "examples/event-gateway-process-plugin",
    "examples/hotkey-process-plugin",
    "examples/textintel-process-plugin",
    # napi-rs fixture for the napi-vm native addon tests. Built on demand by
    # the integration test with its own lockfile, never by the workspace.
    "crates/tiktools-plugin-loader/tests/fixtures/native-tsfn",
    # Musl libc-detection probe, built on demand the same way.
    "crates/tiktools-plugin-loader/tests/fixtures/musl-probe",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.2.2"
thiserror = "2.0"
unicode-segmentation = "1.13"
tracing = "0.1"
fastrand = "2.5"
tokio-util = "0.7"
tokio = { version = "1.48", features = ["rt-multi-thread", "sync", "macros", "time", "net", "io-util", "io-std", "fs"] }
rusqlite = { version = "0.40", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
libloading = "0.8.9"
sha2 = "0.10"
zip = { version = "4.2", default-features = false, features = ["deflate"] }
rfd = { version = "0.15.4", default-features = false, features = ["xdg-portal", "tokio"] }
rodio = { version = "0.21.1", features = ["tracing"] }
# Local mainline checkout: native-addon integration uses `allow_addon` /
# `allow_addon_alias` plus `node:module` createRequire, which live on
# napi-vm main, not on the old guest-target branch. Flip back to a git
# rev once the napi-vm side is pushed.
napi-vm = { path = "../napi-vm", default-features = false }

# The checked-in JavaScript/Bun package was only a compatibility implementation. The desktop
# host consumes the Rust crates directly from the upstream workspace at a pinned revision.
ttl-sign-core = { git = "https://github.com/nglmercer/tiktok-signer", rev = "afa3ec9dac9287beb9f68ed6a009eb4c0a46d348" }
ttl-live-discovery = { git = "https://github.com/nglmercer/tiktok-signer", rev = "afa3ec9dac9287beb9f68ed6a009eb4c0a46d348" }
ttl-live-events = { git = "https://github.com/nglmercer/tiktok-signer", rev = "afa3ec9dac9287beb9f68ed6a009eb4c0a46d348" }
ttl-live-proto = { git = "https://github.com/nglmercer/tiktok-signer", rev = "afa3ec9dac9287beb9f68ed6a009eb4c0a46d348" }
ttl-live-ws = { git = "https://github.com/nglmercer/tiktok-signer", rev = "afa3ec9dac9287beb9f68ed6a009eb4c0a46d348" }
ttl-sign-headless = { git = "https://github.com/nglmercer/tiktok-signer", rev = "afa3ec9dac9287beb9f68ed6a009eb4c0a46d348" }
ttl-sign-embedded = { git = "https://github.com/nglmercer/tiktok-signer", rev = "afa3ec9dac9287beb9f68ed6a009eb4c0a46d348" }
