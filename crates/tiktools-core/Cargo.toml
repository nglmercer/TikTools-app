[package]
name = "tiktools-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Framework-independent TikTools application core"

[features]
default = ["native-plugins"]
native-plugins = ["tiktools-plugin-loader/native-plugins"]
wasm-plugins = ["tiktools-plugin-loader/wasm-plugins"]
plugin-install = ["tiktools-plugin-loader/plugin-install"]
persistence = ["dep:rusqlite"]
http = ["dep:reqwest"]
tiktok-network = ["dep:tokio-tungstenite"]
native-tiktok = ["dep:tiktools-tiktok"]

[dependencies]
tiktools-plugin-api = { path = "../tiktools-plugin-api" }
tiktools-plugin-sdk = { path = "../tiktools-plugin-sdk" }
tiktools-plugin-loader = { path = "../tiktools-plugin-loader", default-features = false }
tiktools-tiktok = { path = "../tiktools-tiktok", optional = true }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
fastrand.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
napi-vm.workspace = true
rusqlite = { workspace = true, optional = true, features = ["bundled"] }
reqwest = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
