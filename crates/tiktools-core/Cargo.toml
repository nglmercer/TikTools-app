[package]
name = "tiktools-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Framework-independent TikTools application core"

[features]
default = ["native-plugins", "napi-vm-node-api"]
native-plugins = ["tiktools-plugin-loader/native-plugins"]
# In-process `.node` addons for napi-vm plugins. The loader dependency
# below opts out of loader defaults, so this forwarding (on by default,
# like `native-plugins`) is what compiles the real addon selection into
# every host. Without it, napi-vm plugins declaring `nativeAddons` fail
# closed at load with "this build lacks napi-vm-node-api support".
napi-vm-node-api = ["tiktools-plugin-loader/napi-vm-node-api"]
wasm-plugins = ["tiktools-plugin-loader/wasm-plugins"]
plugin-install = [
    "dep:tiktools-plugin-installer",
    "dep:tiktools-plugin-package",
    "dep:tiktools-plugin-registry",
    "dep:semver",
    # Origin resolution only; login and keychain stay behind `cloud-auth`.
    "dep:tiktools-cloud-auth",
    "dep:cloud-client",
]
# Optional Cloud account (system-browser login, OS keychain tokens).
# Signing in is opt-in. The origin defaults to the official Cloud and may be
# configured at build time; debug builds also permit a runtime override. Local
# features keep working offline without an account.
cloud-auth = [
    "dep:tiktools-cloud-auth",
    "tiktools-cloud-auth/account",
    "tiktools-cloud-auth/system-browser",
    "tiktools-cloud-auth/os-keychain",
    "dep:tiktools-cloud-sync",
    "dep:cloud-client",
    "dep:uuid",
]
persistence = ["dep:rusqlite"]
http = ["dep:reqwest", "dep:tokio-tungstenite", "tiktools-plugin-sdk/http-client"]
tiktok-network = ["dep:tokio-tungstenite"]
native-tiktok = ["dep:tiktools-tiktok"]
# Explicit synthetic harness only; excluded from normal release artifacts.
live-benchmark = ["native-tiktok"]
app-update = ["dep:tiktools-app-update"]

[dependencies]
tiktools-app-update = { path = "../tiktools-app-update", optional = true }
tiktools-aggregation = { path = "../tiktools-aggregation" }
tiktools-competitions = { path = "../tiktools-competitions" }
tiktools-collaboration = { path = "../tiktools-collaboration" }
tiktools-plugin-api = { path = "../tiktools-plugin-api" }
tiktools-plugin-sdk = { path = "../tiktools-plugin-sdk" }
tiktools-plugin-loader = { path = "../tiktools-plugin-loader", default-features = false }
tiktools-tiktok = { path = "../tiktools-tiktok", optional = true }
tiktools-plugin-installer = { path = "../tiktools-plugin-installer", optional = true }
tiktools-plugin-package = { path = "../tiktools-plugin-package", optional = true }
tiktools-plugin-registry = { path = "../tiktools-plugin-registry", optional = true }
tiktools-cloud-auth = { path = "../tiktools-cloud-auth", version = "4.2.0", optional = true }
tiktools-cloud-sync = { path = "../tiktools-cloud-sync", version = "4.2.0", optional = true }
cloud-client = { path = "../cloud-client", version = "0.1.0", optional = true }
uuid = { version = "1", optional = true }
base64.workspace = true
ring.workspace = true
sha2.workspace = true
futures-util = "0.3"
semver = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
ryu-js.workspace = true
schemars.workspace = true
ttl-live-events.workspace = true
ttl-live-proto.workspace = true
fastrand.workspace = true
getrandom = "0.4.3"
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
tokio-util.workspace = true
rquickjs.workspace = true
rusqlite = { workspace = true, optional = true, features = ["bundled"] }
reqwest = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
url = "2.5.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3.7.0", default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
cloud-client = { path = "../cloud-client", version = "0.1.0" }
secrecy = "0.10"
