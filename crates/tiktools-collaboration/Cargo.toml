[package]
name = "tiktools-collaboration"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Host-owned collaborative LIVE identity, grants and durable sessions"

[dependencies]
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
ring.workspace = true
getrandom = "0.4.3"
fs2 = "0.4"
uuid = { version = "1", features = ["v4"] }
url.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = "3"
