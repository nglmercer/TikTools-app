[package]
name = "tiktools-cloud-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Optional Cloud account for TikTools Desktop: system-browser login, OS keychain tokens, session restore"
publish = false

[features]
default = []
# Test-only: lets a release-profile build honor `TIKTOOLS_E2E_CLOUD_ORIGIN`,
# restricted to loopback origins. Never enabled by default or in official
# builds; see `origin.rs`.
e2e-cloud-origin = []
account = ["dep:cloud-client"]
system-browser = ["account", "dep:open", "cloud-client/system-browser"]
os-keychain = ["account", "cloud-client/os-keychain"]

[dependencies.open]
version = "5"
optional = true

[dependencies]
cloud-client = { path = "../cloud-client", version = "0.1.0", optional = true }
getrandom = "0.4.3"
schemars.workspace = true
secrecy = "0.10"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile = "3"
tokio = { workspace = true }
url.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Tests build real clients; rustls gets its aws-lc-rs provider in test builds only.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
