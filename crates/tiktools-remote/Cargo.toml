[package]
name = "tiktools-remote"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Authenticated TLS remote transport for one existing TikTools control host"

[features]
browser-app = []

[dependencies]
tiktools-control-api = { path = "../tiktools-control-api" }
tiktools-collaboration = { path = "../tiktools-collaboration" }
axum = { version = "0.8.9", features = ["ws"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls.workspace = true
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
ring.workspace = true
tracing.workspace = true
getrandom = "0.4.3"
uuid = { version = "1", features = ["v4"] }
subtle = "2.6"
thiserror.workspace = true

[dev-dependencies]
tiktools-core = { path = "../tiktools-core" }
rcgen = "=0.14.10"
reqwest.workspace = true
tokio-tungstenite.workspace = true
futures-util = "0.3"
tempfile = "3"
