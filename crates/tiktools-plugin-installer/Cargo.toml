[package]
name = "tiktools-plugin-installer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Transactional TikTools plugin package management: install, update, rollback, receipts, and jobs"
publish = false

[features]
default = ["native-providers"]
native-providers = ["tiktools-plugin-sdk/providers"]

[dependencies]
tiktools-plugin-api = { path = "../tiktools-plugin-api", version = "4.0.2" }
tiktools-plugin-package = { path = "../tiktools-plugin-package", version = "4.0.2" }
tiktools-plugin-registry = { path = "../tiktools-plugin-registry", version = "4.0.2" }
tiktools-plugin-sdk = { path = "../tiktools-plugin-sdk", version = "4.0.2", optional = true }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
semver.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true }
fs2 = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
zip.workspace = true
tar.workspace = true
flate2.workspace = true
base64.workspace = true
sha2.workspace = true
tiktools-plugin-sdk = { path = "../tiktools-plugin-sdk", features = ["providers"] }
