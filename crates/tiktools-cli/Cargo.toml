[package]
name = "tiktools-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Thin headless CLI over the TikTools control API"

[[bin]]
name = "tiktools"
path = "src/main.rs"

[features]
default = []
local-web = ["dep:axum", "dep:rand"]

[dependencies]
tiktools-client = { path = "../tiktools-client" }
tiktools-control-api = { path = "../tiktools-control-api", features = ["native-tiktok", "http"] }
tiktools-core = { path = "../tiktools-core" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }

axum = { version = "0.8", optional = true, features = ["ws"] }
rand = { version = "0.10", optional = true }
