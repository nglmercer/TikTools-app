[package]
name = "tiktools-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Thin headless CLI over the TikTools control API"

[[bin]]
name = "tiktools"
path = "src/main.rs"

[features]
default = ["cloud-auth", "tls-aws-lc"]
# TLS provider for this binary; see tiktools-desktop for the selection rule.
tls-aws-lc = ["tiktools-tls/aws-lc-rs"]
tls-ring = ["tiktools-tls/ring"]
local-web = ["dep:axum", "dep:rand"]
# `cloud-auth` enables account, sync and relay support. Remote control itself
# is an installable plugin (`tiktools.remote-control`), not compiled here.
cloud-auth = [
    "tiktools-core/cloud-auth",
    "tiktools-control-api/cloud-auth",
    "tiktools-client/cloud-auth",
]
# Test-only: honor TIKTOOLS_E2E_CLOUD_ORIGIN (loopback) in release builds.
e2e-cloud-origin = ["tiktools-core/e2e-cloud-origin"]

[dependencies]
tiktools-client = { path = "../tiktools-client" }
tiktools-tls = { path = "../tiktools-tls", default-features = false }
tiktools-control-api = { path = "../tiktools-control-api", features = ["native-tiktok", "http"] }
tiktools-core = { path = "../tiktools-core" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }

axum = { version = "0.8.9", optional = true, features = ["ws"] }
rand = { version = "0.10.3", optional = true }
rpassword = { version = "=7.5.4", optional = true }
zeroize = { version = "1", optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
# Integration tests build in-process clients; rustls gets its aws-lc-rs provider in test builds only.
reqwest = { workspace = true, features = ["rustls"] }
rcgen = "=0.14.10"
ring.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["process"] }
