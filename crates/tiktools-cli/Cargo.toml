[package]
name = "tiktools-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Thin headless CLI over the TikTools control API"

[[bin]]
name = "tiktools"
path = "src/main.rs"

[dependencies]
tiktools-control-api = { path = "../tiktools-control-api", features = ["native-tiktok", "http"] }
tiktools-core = { path = "../tiktools-core" }
serde_json.workspace = true
tokio.workspace = true
