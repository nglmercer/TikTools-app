[package]
name = "tiktools-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Thin Winit/Wry desktop host for TikTools"

[features]
default = ["persistence", "plugin-install", "http"]
devtools = ["wry/devtools"]
live-benchmark = ["tiktools-core/live-benchmark"]
plugin-install = ["tiktools-core/plugin-install"]
persistence = ["tiktools-core/persistence"]
http = ["tiktools-core/http"]

[dependencies]
tiktools-core = { path = "../tiktools-core", features = ["native-tiktok"] }
tiktools-control-api = { path = "../tiktools-control-api" }
tiktools-plugin-api = { path = "../tiktools-plugin-api" }
serde_json.workspace = true
serde.workspace = true
tokio.workspace = true
rustls.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
percent-encoding = "2.3.2"
url = "2.5.8"
winit = "0.30.13"
wry = { version = "0.57.1", features = ["tracing"] }
tray-icon = "0.26.1"
rfd.workspace = true
rodio.workspace = true

[dev-dependencies]
tiktools-plugin-loader = { path = "../tiktools-plugin-loader" }

[target.'cfg(target_os = "linux")'.dependencies]
# Wry 0.57 / WebKitGTK 2.0 require the GTK 0.18 ABI; 0.19 conflicts on gdk-3.
gtk = "0.18.2"
webkit2gtk = "2.0.2"
x11-dl = "2.21.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
