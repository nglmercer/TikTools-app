[package]
name = "tiktools-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Thin Winit/Wry desktop host for TikTools"

[features]
default = ["persistence", "plugin-install", "http"]
devtools = ["wry/devtools"]
plugin-install = ["tiktools-core/plugin-install"]
persistence = ["tiktools-core/persistence"]
http = ["tiktools-core/http"]

[dependencies]
tiktools-core = { path = "../tiktools-core", features = ["native-tiktok"] }
tiktools-control-api = { path = "../tiktools-control-api" }
tiktools-plugin-api = { path = "../tiktools-plugin-api" }
serde_json.workspace = true
tokio.workspace = true
rustls.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
percent-encoding = "2.3"
url = "2.5"
winit = "0.30"
wry = { version = "0.57", features = ["tracing"] }
tray-icon = "0.25"
rfd.workspace = true
rodio.workspace = true

[dev-dependencies]
tiktools-plugin-loader = { path = "../tiktools-plugin-loader" }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
x11-dl = "2.21"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
