[package]
name = "tiktools-tiktok"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Desktop-independent TikTok client boundary"

[dependencies]
tiktools-plugin-sdk = { path = "../tiktools-plugin-sdk", features = ["http-client"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
fastrand.workspace = true
httpdate = "1"
tokio.workspace = true
tokio-util.workspace = true
reqwest.workspace = true
rustls.workspace = true
ttl-sign-core.workspace = true
ttl-live-discovery.workspace = true
ttl-live-events.workspace = true
ttl-live-ws.workspace = true
ttl-sign-headless.workspace = true
ttl-sign-embedded.workspace = true

# Android has no shipped QuickJS bindings: generate against native Bionic headers.
# Match ttl-sign-embedded's rquickjs 0.12 so bindgen is enabled on its engine.
# A standalone 0.14 dependency would not enable bindgen for the signer.
[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "0.12.2", default-features = false, features = ["bindgen"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
prost = "0.14.3"
ttl-live-proto.workspace = true
