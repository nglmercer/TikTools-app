[package]
name = "tiktools-tiktok"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Desktop-independent TikTok client boundary"

[dependencies]
tiktools-plugin-sdk = { path = "../tiktools-plugin-sdk", features = ["http-client"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
fastrand.workspace = true
httpdate = "1"
tokio.workspace = true
tokio-util.workspace = true
reqwest.workspace = true
rustls.workspace = true
ttl-sign-core.workspace = true
ttl-live-discovery.workspace = true
ttl-live-events.workspace = true
ttl-live-ws.workspace = true
ttl-sign-headless.workspace = true
ttl-sign-embedded.workspace = true

# Android has no shipped QuickJS bindings: generate against native Bionic headers.
# ttl-sign-embedded pulls rquickjs 0.12.2, while this crate's SDK uses 0.14.
# Both need bindgen on Android (no pre-generated Bionic bindings); keep both
# target deps so Cargo enables the feature on each copy.
[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "0.14.0", default-features = false, features = ["bindgen"] }
rquickjs_012 = { package = "rquickjs", version = "0.12.2", default-features = false, features = ["bindgen"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
prost = "0.14.3"
ttl-live-proto.workspace = true
