[package]
name = "tiktools-tiktok"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Desktop-independent TikTok client boundary"

[dependencies]
tiktools-tls = { path = "../tiktools-tls" }
tiktools-plugin-sdk = { path = "../tiktools-plugin-sdk", features = ["http-client-no-provider"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
fastrand.workspace = true
httpdate = "1"
tokio.workspace = true
tokio-util.workspace = true
reqwest.workspace = true
rustls.workspace = true
ttl-sign-core.workspace = true
ttl-live-discovery.workspace = true
ttl-live-events.workspace = true
ttl-live-ws.workspace = true
ttl-sign-headless.workspace = true
ttl-sign-embedded.workspace = true

# Android has no shipped QuickJS bindings: generate against native Bionic headers.
# Both this crate and ttl-sign-embedded now use rquickjs 0.14, so a single
# bindgen target dep is enough (feature unification enables it everywhere).
[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "0.14.0", default-features = false, features = ["bindgen"] }

[dev-dependencies]
# Tests build real clients; rustls gets its aws-lc-rs provider in test builds only.
reqwest = { workspace = true, features = ["rustls"] }

tokio = { workspace = true, features = ["test-util"] }
prost = "0.14.3"
ttl-live-proto.workspace = true
