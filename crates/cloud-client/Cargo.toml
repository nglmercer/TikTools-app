[package]
name = "cloud-client"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "MIT"

[features]
default = []
system-browser = ["dep:open"]
os-keychain = ["dep:keyring"]

[dependencies]
cloud-contracts = { path = "../cloud-contracts" }
better-auth = { git = "https://github.com/nglmercer/better-auth-rs.git", rev = "aadd81d630aed4bd950d4e5581a5efbb304ca3e7", default-features = false, features = ["desktop"] }
base64.workspace = true
getrandom.workspace = true
sha2.workspace = true
zeroize = "1"
tokio = { workspace = true, features = ["sync", "time"] }
open = { version = "5", optional = true }
fs2 = "0.4"
tempfile = "3"
reqwest = { workspace = true, features = ["json", "query"] }
secrecy = "0.10"
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
thiserror.workspace = true
url.workspace = true
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
# Tests build real clients; rustls gets its aws-lc-rs provider in test builds only.
reqwest = { workspace = true, features = ["json", "query", "rustls"] }

tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"], optional = true }
