[package]
name = "cloud-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"

[features]
default = []
system-browser = ["dep:open"]
os-keychain = ["dep:keyring"]

[dependencies]
better-auth = { git = "https://github.com/nglmercer/better-auth-rs.git", rev = "c6940517155ff9a123221789b1efc89ef48cb19c", default-features = false }
base64 = "0.23"
getrandom = "0.4"
sha2 = "0.11"
zeroize = "1"
tokio = { version = "1", features = ["sync", "time"] }
open = { version = "5", optional = true }
fs2 = "0.4"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"], optional = true }
# better-auth pulls in webauthn-rs, which links OpenSSL. Windows runners and
# end-user machines have no system OpenSSL, so build it from source and link
# it statically.
openssl = { version = "0.10", features = ["vendored"] }
