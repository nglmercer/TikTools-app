[package]
name = "tiktools-app-update"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Application update policy and signed release metadata validation"

[dependencies]
base64.workspace = true
minisign-verify = "=0.3.0"
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
url = { workspace = true, features = ["serde"] }
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Registry"] }

[dev-dependencies]
# Tests build real clients; rustls gets its aws-lc-rs provider in test builds only.
reqwest = { workspace = true, features = ["rustls"] }

tokio.workspace = true
