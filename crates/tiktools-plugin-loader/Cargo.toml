[package]
name = "tiktools-plugin-loader"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Runtime discovery and loading for TikTools plugins"

[features]
default = ["native-plugins", "napi-vm-node-api"]
native-plugins = ["dep:libloading"]
wasm-plugins = []
# In-process `.node` addons for napi-vm plugins (napi-rs). Compiled in by
# default, but never active without an explicit per-plugin manifest
# declaration: with no `nativeAddons` entry the guest stays inside the
# pure-Rust VM with no native code. Native addons are trusted code, never
# sandboxed; each one must be separately allowlisted with a SHA-256 digest
# from trusted host metadata.
napi-vm-node-api = ["dep:libloading"]

[dependencies]
tiktools-plugin-api = { path = "../tiktools-plugin-api" }
rquickjs.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# Required (not optional): the Tokio→worker call bridge is async end to
# end — Tokio senders plus oneshot responses — so plugin calls no longer
# spend a `spawn_blocking` thread per invocation waiting on a blocking
# queue. Worker threads receive through `blocking_recv`, which needs no
# runtime context.
tokio = { workspace = true }
tracing.workspace = true
semver.workspace = true
libloading = { workspace = true, optional = true }

[target.'cfg(target_os = "android")'.dependencies]
# QuickJS ships no pre-generated Android bindings. Generate them with the
# target Clang headers; keep the bindgen toolchain optional on desktop builds.
rquickjs = { workspace = true, features = ["bindgen"] }

[dev-dependencies]
tiktools-plugin-sdk = { path = "../tiktools-plugin-sdk" }
